name: Integrity Gate

on:
  pull_request:
    branches: [master, main]

jobs:
  integrity:
    # A called workflow can only use permissions the caller grants. The integrity gate
    # comments on the PR and sets a commit status, so it needs these two writes.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ilegault/ticket-engine/.github/workflows/integrity.yml@v1
    with:
      python-version: "3.14"
